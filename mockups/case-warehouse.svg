<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 210" role="img" aria-label="Multi-client data warehouse mockup: multiple sources feed one warehouse serving separate client dashboards.">
  <rect width="400" height="210" fill="#0a1628"/>
  <text x="16" y="22" font-family="sans-serif" font-size="9" font-weight="700" letter-spacing="1.5" fill="#5b9dff">MULTI-CLIENT WAREHOUSE</text>

  <!-- sources (left) -->
  <text x="20" y="48" font-family="sans-serif" font-size="7.5" font-weight="700" fill="#c8d8f0">SOURCES</text>
  <g font-family="sans-serif" font-size="7.5" fill="#c8d8f0">
    <rect x="18" y="56" width="70" height="22" rx="5" fill="#0f1e3d" stroke="#1d2f54"/><text x="30" y="70">CRM</text>
    <rect x="18" y="86" width="70" height="22" rx="5" fill="#0f1e3d" stroke="#1d2f54"/><text x="30" y="100">Finance</text>
    <rect x="18" y="116" width="70" height="22" rx="5" fill="#0f1e3d" stroke="#1d2f54"/><text x="30" y="130">Ops API</text>
    <rect x="18" y="146" width="70" height="22" rx="5" fill="#0f1e3d" stroke="#1d2f54"/><text x="30" y="160">Sheets</text>
  </g>
  <!-- connectors to warehouse -->
  <g stroke="#2a3f6b" stroke-width="1.6" fill="none">
    <path d="M88 67 C120 67 130 100 158 105"/>
    <path d="M88 97 C120 97 132 103 158 105"/>
    <path d="M88 127 C120 127 132 108 158 108"/>
    <path d="M88 157 C120 157 130 112 158 110"/>
  </g>

  <!-- warehouse cylinder (center) -->
  <g transform="translate(158,70)">
    <ellipse cx="34" cy="10" rx="32" ry="9" fill="#13284a" stroke="#00d4ff"/>
    <path d="M2 10 v50 c0 5 14 9 32 9 s32 -4 32 -9 v-50" fill="#0f1e3d" stroke="#00d4ff"/>
    <path d="M2 10 c0 5 14 9 32 9 s32 -4 32 -9" fill="none" stroke="#00d4ff" opacity="0.6"/>
    <path d="M2 35 c0 5 14 9 32 9 s32 -4 32 -9" fill="none" stroke="#5b9dff" opacity="0.6"/>
    <text x="34" y="86" font-family="sans-serif" font-size="7.5" font-weight="700" fill="#c8d8f0" text-anchor="middle">WAREHOUSE</text>
  </g>
  <!-- connectors to clients -->
  <g stroke="#2a3f6b" stroke-width="1.6" fill="none">
    <path d="M226 80 C260 80 268 64 296 60"/>
    <path d="M226 92 C262 92 270 104 296 108"/>
    <path d="M226 104 C262 110 270 150 296 154"/>
  </g>

  <!-- client dashboards (right) -->
  <text x="300" y="48" font-family="sans-serif" font-size="7.5" font-weight="700" fill="#c8d8f0">CLIENTS</text>
  <g>
    <rect x="296" y="52" width="88" height="32" rx="5" fill="#0f1e3d" stroke="#00d4ff"/>
    <rect x="304" y="60" width="14" height="16" rx="2" fill="#00d4ff"/><rect x="322" y="66" width="14" height="10" rx="2" fill="#1d2f54"/><text x="342" y="66" font-family="sans-serif" font-size="7" fill="#7a90b8">Client A</text>
    <rect x="296" y="100" width="88" height="32" rx="5" fill="#0f1e3d" stroke="#5b9dff"/>
    <rect x="304" y="108" width="14" height="16" rx="2" fill="#5b9dff"/><rect x="322" y="114" width="14" height="10" rx="2" fill="#1d2f54"/><text x="342" y="114" font-family="sans-serif" font-size="7" fill="#7a90b8">Client B</text>
    <rect x="296" y="148" width="88" height="32" rx="5" fill="#0f1e3d" stroke="#10d9a0"/>
    <rect x="304" y="156" width="14" height="16" rx="2" fill="#10d9a0"/><rect x="322" y="162" width="14" height="10" rx="2" fill="#1d2f54"/><text x="342" y="162" font-family="sans-serif" font-size="7" fill="#7a90b8">Client C</text>
  </g>
</svg>
