<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 760" font-family="Inter, -apple-system, system-ui, sans-serif" role="img" aria-label="Sello mobile app interface — voice-driven sales entry, today's stats, recent sales feed, low stock alert, bottom navigation">
  <title>Sello — mobile app preview</title>
  <defs>
    <linearGradient id="smOrange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="smBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8ee"/>
      <stop offset="1" stop-color="#fcefe0"/>
    </linearGradient>
    <linearGradient id="smBezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f1f1f"/>
      <stop offset="1" stop-color="#080808"/>
    </linearGradient>
    <filter id="smShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#0a0a0a" flood-opacity="0.07"/>
    </filter>
    <filter id="smShadowSoft" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0a0a0a" flood-opacity="0.05"/>
    </filter>
  </defs>

  <rect x="4" y="4" width="352" height="752" rx="48" ry="48" fill="url(#smBezel)"/>
  <rect x="8" y="8" width="344" height="744" rx="44" ry="44" fill="#000"/>
  <rect x="14" y="14" width="332" height="732" rx="38" ry="38" fill="url(#smBg)"/>

  <rect x="138" y="22" width="84" height="24" rx="12" ry="12" fill="#0a0a0a"/>
  <circle cx="208" cy="34" r="3.2" fill="#1a1a1a"/>

  <g font-size="11" font-weight="700" fill="#0a0a0a">
    <text x="38" y="40">9:41</text>
    <g transform="translate(286,30)">
      <rect x="0" y="6" width="2.4" height="4" rx="0.5" fill="#0a0a0a"/>
      <rect x="4" y="4" width="2.4" height="6" rx="0.5" fill="#0a0a0a"/>
      <rect x="8" y="2" width="2.4" height="8" rx="0.5" fill="#0a0a0a"/>
      <rect x="12" y="0" width="2.4" height="10" rx="0.5" fill="#0a0a0a"/>
      <path d="M 22 7 Q 26 4 30 7 M 24 9 Q 26 7.5 28 9" stroke="#0a0a0a" stroke-width="1.4" fill="none" stroke-linecap="round"/>
      <circle cx="26" cy="10" r="1" fill="#0a0a0a"/>
      <rect x="36" y="2" width="22" height="9" rx="2.2" fill="none" stroke="#0a0a0a" stroke-width="1.1"/>
      <rect x="38" y="4" width="16" height="5" rx="0.6" fill="#0a0a0a"/>
      <rect x="58.5" y="4" width="1.6" height="5" rx="0.5" fill="#0a0a0a"/>
    </g>
  </g>

  <g transform="translate(0, 62)">
    <g transform="translate(28, 0)">
      <rect x="0" y="0" width="34" height="34" rx="10" fill="url(#smOrange)"/>
      <text x="17" y="23" font-size="17" font-weight="800" fill="#fff" text-anchor="middle">S</text>
    </g>
    <text x="72" y="22" font-size="17" font-weight="800" fill="#0a0a0a" letter-spacing="-0.02em">sello</text>
    <text x="72" y="34" font-size="9" font-weight="600" fill="#9ca3af" letter-spacing="0.06em">PRIYA'S BOUTIQUE</text>
    <g transform="translate(310, 16)">
      <circle r="16" fill="#fff" stroke="#f3f4f6" stroke-width="1"/>
      <path d="M -4.5 -3 Q -4.5 -8 0 -8 Q 4.5 -8 4.5 -3 L 4.5 1 L 6 4 L -6 4 Z" fill="none" stroke="#0a0a0a" stroke-width="1.3" stroke-linejoin="round"/>
      <path d="M -2 5 Q 0 7 2 5" fill="none" stroke="#0a0a0a" stroke-width="1.3" stroke-linecap="round"/>
      <circle cx="6" cy="-6" r="3.2" fill="#ef4444"/>
      <text x="6" y="-4" font-size="6" font-weight="800" fill="#fff" text-anchor="middle">2</text>
    </g>
  </g>

