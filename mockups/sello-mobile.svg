    <circle cx="34" cy="29" r="16" fill="#fde68a"/>
    <text x="34" y="34" font-size="14" font-weight="800" fill="#92400e" text-anchor="middle">P</text>
    <text x="62" y="25" font-size="13" font-weight="700" fill="#0a0a0a">Priya · 2 red kurtis</text>
    <text x="62" y="41" font-size="10.5" fill="#6b7280">Just now · WhatsApp invoice sent</text>
    <text x="282" y="25" font-size="14" font-weight="800" fill="#0a0a0a" text-anchor="end">₹2,400</text>
    <g transform="translate(298, 36)">
