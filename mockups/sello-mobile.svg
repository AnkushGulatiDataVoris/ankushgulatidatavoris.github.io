      <rect x="6" y="-13" width="3" height="26" rx="1.5" fill="#fff" opacity="0.85"/>
      <rect x="12" y="-7" width="3" height="14" rx="1.5" fill="#fff" opacity="0.7"/>
      <rect x="18" y="-11" width="3" height="22" rx="1.5" fill="#fff"/>
