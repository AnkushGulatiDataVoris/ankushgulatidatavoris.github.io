    <rect width="320" height="170" rx="22" fill="#fff"/>
    <text x="22" y="32" font-size="10" font-weight="800" fill="#9ca3af" letter-spacing="0.14em">TODAY · TUE 14 JAN</text>

    <text x="22" y="76" font-size="34" font-weight="900" fill="#0a0a0a" letter-spacing="-0.03em">₹8,420</text>

    <g transform="translate(22, 92)">
      <rect width="56" height="22" rx="6" fill="#dcfce7"/>
      <text x="28" y="15" font-size="11" font-weight="800" fill="#15803d" text-anchor="middle">↑ 23%</text>
      <text x="66" y="15" font-size="11" font-weight="600" fill="#6b7280">vs yesterday</text>
    </g>

    <g transform="translate(22, 132)">
      <rect x="0" y="10" width="6" height="16" rx="1.5" fill="#fed7aa"/>
      <rect x="11" y="6" width="6" height="20" rx="1.5" fill="#fed7aa"/>
      <rect x="22" y="12" width="6" height="14" rx="1.5" fill="#fed7aa"/>
      <rect x="33" y="2" width="6" height="24" rx="1.5" fill="#fed7aa"/>
      <rect x="44" y="8" width="6" height="18" rx="1.5" fill="#fed7aa"/>
      <rect x="55" y="4" width="6" height="22" rx="1.5" fill="#fed7aa"/>
