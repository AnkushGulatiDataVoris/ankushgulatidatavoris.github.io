      <path d="M -5 13 Q -5 25 7 25 Q 19 25 19 13" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="7" y1="25" x2="7" y2="32" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>
    </g>
