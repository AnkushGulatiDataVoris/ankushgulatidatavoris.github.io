      <text y="24" font-size="22" font-weight="900" fill="#0a0a0a">12</text>
      <text y="40" font-size="11" fill="#6b7280">today</text>
    </g>
    <g transform="translate(196, 92)">
      <text font-size="10" font-weight="800" fill="#9ca3af" letter-spacing="0.1em">PROFIT</text>
      <text y="24" font-size="22" font-weight="900" fill="#15803d">₹2,180</text>
      <text y="40" font-size="11" fill="#6b7280">margin 26%</text>
    </g>
  </g>

  <g transform="translate(20, 314)">
