    <g transform="translate(20, 20)">
      <path d="M 0 -9 L 9 7 L -9 7 Z" fill="#f59e0b"/>
      <text y="4" font-size="10" font-weight="900" fill="#fff" text-anchor="middle">!</text>
    </g>
    <text x="38" y="25" font-size="12" font-weight="700" fill="#92400e">3 items low on stock · reorder?</text>
    <text x="298" y="25" font-size="13" font-weight="800" fill="#92400e" text-anchor="end">→</text>
  </g>

  <g transform="translate(14, 678)">
    <rect width="332" height="58" rx="0" fill="#fff" stroke="#f3f4f6" stroke-width="1"/>

    <g transform="translate(40, 24)">
      <path d="M -8 4 L 0 -5 L 8 4 L 8 11 L 3 11 L 3 5 L -3 5 L -3 11 L -8 11 Z" fill="#ea580c" stroke="#ea580c" stroke-width="0.4" stroke-linejoin="round"/>
      <text y="26" font-size="9" font-weight="800" fill="#ea580c" text-anchor="middle">Home</text>
    </g>

    <g transform="translate(105, 24)">
      <path d="M -7 -1 L -7 9 L 7 9 L 7 -1 Z" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M -5 -1 Q -5 -7 0 -7 Q 5 -7 5 -1" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
      <text y="26" font-size="9" font-weight="600" fill="#9ca3af" text-anchor="middle">Sales</text>
    </g>

    <g transform="translate(170, 24)">
      <rect x="-7" y="-6" width="6" height="6" rx="1" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
      <rect x="1" y="-6" width="6" height="6" rx="1" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
      <rect x="-3" y="2" width="6" height="6" rx="1" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
      <text y="26" font-size="9" font-weight="600" fill="#9ca3af" text-anchor="middle">Stock</text>
    </g>

    <g transform="translate(235, 24)">
      <rect x="-6" y="-8" width="12" height="15" rx="1.5" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
      <line x1="-3" y1="-4" x2="3" y2="-4" stroke="#9ca3af" stroke-width="1.2"/>
      <line x1="-3" y1="-1" x2="3" y2="-1" stroke="#9ca3af" stroke-width="1.2"/>
      <line x1="-3" y1="2" x2="1" y2="2" stroke="#9ca3af" stroke-width="1.2"/>
      <text y="26" font-size="9" font-weight="600" fill="#9ca3af" text-anchor="middle">Bills</text>
    </g>

    <g transform="translate(300, 24)">
