  <g transform="translate(20, 484)" filter="url(#smShadowSoft)">
    <rect width="320" height="58" rx="14" fill="#fff"/>
    <circle cx="34" cy="29" r="16" fill="#fbcfe8"/>
    <text x="34" y="34" font-size="14" font-weight="800" fill="#9d174d" text-anchor="middle">W</text>
    <text x="62" y="25" font-size="13" font-weight="700" fill="#0a0a0a">Walk-in · Maybelline lipstick</text>
    <text x="62" y="41" font-size="10.5" fill="#6b7280">8 min ago · cash paid</text>
    <text x="270" y="25" font-size="14" font-weight="800" fill="#0a0a0a" text-anchor="end">₹890</text>
    <rect x="278" y="29" width="34" height="16" rx="8" fill="#f3f4f6"/>
    <text x="295" y="40" font-size="9" font-weight="800" fill="#6b7280" text-anchor="middle">CASH</text>
  </g>

  <g transform="translate(20, 552)" filter="url(#smShadowSoft)">
    <rect width="320" height="58" rx="14" fill="#fff"/>
    <circle cx="34" cy="29" r="16" fill="#bfdbfe"/>
    <text x="34" y="34" font-size="14" font-weight="800" fill="#1e40af" text-anchor="middle">R</text>
    <text x="62" y="25" font-size="13" font-weight="700" fill="#0a0a0a">Rahul · ladies sandals</text>
    <text x="62" y="41" font-size="10.5" fill="#d97706">Reminder sent · payment pending</text>
    <text x="262" y="25" font-size="14" font-weight="800" fill="#0a0a0a" text-anchor="end">₹4,500</text>
    <rect x="266" y="29" width="46" height="16" rx="8" fill="#fef3c7"/>
    <text x="289" y="40" font-size="9" font-weight="800" fill="#92400e" text-anchor="middle">PENDING</text>
  </g>

  <g transform="translate(20, 620)">
