<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 210" role="img" aria-label="Sales performance dashboard mockup with KPI cards, a trend line and a bar chart.">
  <defs>
    <linearGradient id="s-area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00d4ff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#00d4ff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="400" height="210" fill="#0a1628"/>
  <!-- header label -->
  <text x="16" y="22" font-family="sans-serif" font-size="9" font-weight="700" letter-spacing="1.5" fill="#5b9dff">SALES PERFORMANCE</text>
  <!-- KPI cards -->
  <g>
    <rect x="16" y="38" width="116" height="48" rx="8" fill="#0f1e3d" stroke="#1d2f54"/>
    <rect x="16" y="38" width="116" height="3" rx="1.5" fill="#00d4ff"/>
    <text x="28" y="62" font-family="sans-serif" font-size="15" font-weight="800" fill="#f0f6ff">$1.24M</text>
    <text x="28" y="76" font-family="sans-serif" font-size="7.5" fill="#7a90b8">REVENUE · MTD</text>
  </g>
  <g>
    <rect x="142" y="38" width="116" height="48" rx="8" fill="#0f1e3d" stroke="#1d2f54"/>
    <rect x="142" y="38" width="116" height="3" rx="1.5" fill="#5b9dff"/>
    <text x="154" y="62" font-family="sans-serif" font-size="15" font-weight="800" fill="#f0f6ff">328</text>
    <text x="154" y="76" font-family="sans-serif" font-size="7.5" fill="#7a90b8">DEALS CLOSED</text>
  </g>
  <g>
    <rect x="268" y="38" width="116" height="48" rx="8" fill="#0f1e3d" stroke="#1d2f54"/>
    <rect x="268" y="38" width="116" height="3" rx="1.5" fill="#10d9a0"/>
    <text x="280" y="62" font-family="sans-serif" font-size="15" font-weight="800" fill="#10d9a0">112%</text>
    <text x="280" y="76" font-family="sans-serif" font-size="7.5" fill="#7a90b8">OF TARGET</text>
  </g>
  <!-- trend chart -->
  <rect x="16" y="98" width="226" height="96" rx="8" fill="#0f1e3d" stroke="#1d2f54"/>
  <text x="28" y="116" font-family="sans-serif" font-size="8" font-weight="700" fill="#c8d8f0">REVENUE TREND</text>
  <path d="M28 180 L60 168 L92 172 L124 150 L156 156 L188 132 L220 120 L230 120 L230 184 L28 184 Z" fill="url(#s-area)"/>
  <path d="M28 180 L60 168 L92 172 L124 150 L156 156 L188 132 L220 120" fill="none" stroke="#00d4ff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="220" cy="120" r="3" fill="#00d4ff"/>
  <!-- bar chart -->
  <rect x="252" y="98" width="132" height="96" rx="8" fill="#0f1e3d" stroke="#1d2f54"/>
  <text x="264" y="116" font-family="sans-serif" font-size="8" font-weight="700" fill="#c8d8f0">BY REGION</text>
  <rect x="266" y="150" width="14" height="34" rx="2" fill="#00d4ff"/>
  <rect x="288" y="134" width="14" height="50" rx="2" fill="#5b9dff"/>
  <rect x="310" y="158" width="14" height="26" rx="2" fill="#5b9dff"/>
  <rect x="332" y="142" width="14" height="42" rx="2" fill="#10d9a0"/>
  <rect x="354" y="164" width="14" height="20" rx="2" fill="#5b9dff"/>
</svg>
