<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<link rel="icon" type="image/svg+xml" href="favicon.svg?v=2"/>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=2"/>
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png?v=2"/>
<link rel="shortcut icon" href="favicon.ico?v=2"/>
<link rel="apple-touch-icon" href="favicon-preview-256.png?v=2"/>
<meta name="theme-color" content="#0a1628"/>

<title>Your Data Maturity Report — Datavoris</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cabinet+Grotesk:wght@300;400;500;700;800;900&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --n9:#050e1f;--n8:#0a1628;--n7:#0f1e3d;--n6:#162444;--n5:#1d2f54;--n4:#2a3f6b;--n3:#3d5585;
  --cyan:#00d4ff;--cdim:rgba(0,212,255,0.1);--cglow:rgba(0,212,255,0.25);
  --amber:#f59e0b;--adim:rgba(245,158,11,0.1);--em:#10d9a0;--rose:#fb7185;
  --wh:#f8faff;--off:#eef2fa;--card:#fff;
  --t1:#f0f6ff;--t3:#c8d8f0;--t5:#7a90b8;--t7:#3d5585;
  --ow9:#080e1e;--ow7:#1a2744;--ow5:#4a607e;--ow3:#7a90b8;
  --bn:rgba(255,255,255,0.07);--bw:rgba(8,14,30,0.1);
  --r:14px;--rsm:9px;--rxl:24px;
  --fd:'Cabinet Grotesk',sans-serif;--fb:'DM Sans',sans-serif;
  --ease:cubic-bezier(0.16,1,0.3,1);
}
html{scroll-behavior:smooth;-webkit-font-smoothing:antialiased;}
body{font-family:var(--fb);background:var(--wh);color:var(--ow9);min-height:100vh;display:flex;flex-direction:column;align-items:center;}
/* NAV — matches dv-style.css .site-nav exactly */
.nav{width:100%;background:var(--n8);border-bottom:1px solid var(--bn);position:sticky;top:0;z-index:200;backdrop-filter:blur(20px);}
.nav-container{width:100%;max-width:1180px;margin:0 auto;padding:0 2rem;display:flex;align-items:center;justify-content:space-between;height:62px;gap:2rem;}
.brand{font-family:var(--fd);font-size:1.15rem;font-weight:800;color:var(--t1);letter-spacing:-0.03em;display:inline-flex;align-items:center;gap:0.6rem;text-decoration:none;flex-shrink:0;}
.bmark{width:34px;height:34px;border-radius:9px;background:var(--n9);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(0,212,255,0.3);}
.bmark svg{width:72%;height:72%;display:block;}
.nav-links{display:flex;align-items:center;gap:0.2rem;}
.nav-links a{font-family:var(--fb);font-size:0.85rem;color:var(--t5);text-decoration:none;padding:0.4rem 0.85rem;border-radius:7px;transition:color 0.15s,background 0.15s;display:inline-flex;align-items:center;justify-content:space-between;gap:0.5rem;}
.nav-links a:hover{color:var(--t1);background:rgba(255,255,255,0.06);}
.nav-links a.active{color:var(--cyan);}
.nav-cta-mobile{display:none;}
.hire-btn{display:inline-flex;align-items:center;gap:6px;line-height:1.7;background:var(--cyan);color:var(--n9);font-family:var(--fb);font-size:0.82rem;font-weight:700;padding:0.55rem 1.2rem;border-radius:999px;text-decoration:none;border:none;cursor:pointer;flex-shrink:0;box-shadow:0 6px 20px rgba(0,212,255,0.25);transition:transform 0.15s var(--ease),box-shadow 0.25s,opacity 0.15s;letter-spacing:0.01em;white-space:nowrap;}
.hire-btn:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(0,212,255,0.4);}
.nav-burger{display:none;width:42px;height:42px;border-radius:10px;background:transparent;border:1px solid rgba(255,255,255,0.12);color:var(--t1);align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;padding:0;transition:background 0.15s,border-color 0.15s;}
.nav-burger:hover{background:rgba(255,255,255,0.06);border-color:rgba(0,212,255,0.3);}
.nav-burger svg{width:18px;height:18px;}
.nav-burger .x-icon{display:none;}
.nav-burger.open .menu-icon{display:none;}
.nav-burger.open .x-icon{display:block;}
.nav-backdrop{position:fixed;inset:62px 0 0 0;background:rgba(5,14,31,0.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity 0.25s var(--ease);z-index:198;}
.nav-backdrop.open{opacity:1;pointer-events:auto;}
@media(max-width:768px){
  .nav-container{gap:0.6rem;padding:0 1.25rem;}
  .hire-btn{display:none;}
  .nav-burger{display:inline-flex;margin-left:auto;}
  .nav-links{position:fixed;top:62px;right:0;left:0;flex-direction:column;align-items:stretch;gap:0;background:var(--n9);border-bottom:1px solid rgba(255,255,255,0.08);padding:0 1.25rem;margin-left:0;max-height:0;overflow:hidden;transition:max-height 0.3s var(--ease),padding 0.3s var(--ease);z-index:199;box-shadow:0 16px 32px rgba(0,0,0,0.4);}
  .nav-links.open{max-height:640px;padding:0.5rem 1.25rem 1.2rem;}
  .nav-links a{padding:0.9rem 0.6rem;border-radius:8px;font-size:0.95rem;color:#e8eefc;justify-content:space-between;}
  .nav-links a:not(:last-of-type){border-bottom:1px solid rgba(255,255,255,0.05);}
  .nav-links a::after{content:"→";color:var(--t7);font-size:0.95rem;transition:color 0.15s,transform 0.15s;}
  .nav-links a:hover::after,.nav-links a.active::after{color:var(--cyan);transform:translateX(3px);}
  .nav-cta-mobile{display:block;margin-top:0.5rem;padding-top:0.85rem;border-top:1px solid rgba(255,255,255,0.1);}
  .nav-cta-mobile a{display:flex;align-items:center;justify-content:center;background:var(--cyan);color:var(--n9);font-weight:700;border-radius:999px;padding:0.8rem 1rem;text-decoration:none;font-size:0.92rem;}
  .nav-cta-mobile a::after{display:none;}
}
.main{width:100%;max-width:820px;padding:2.5rem 1.5rem 8rem;}
.fade{animation:fu 0.5s var(--ease) both;}
.fade2{animation:fu 0.5s 0.1s var(--ease) both;}
.fade3{animation:fu 0.5s 0.2s var(--ease) both;}
.fade4{animation:fu 0.5s 0.3s var(--ease) both;}
.fade5{animation:fu 0.5s 0.4s var(--ease) both;}
@keyframes fu{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}

/* HEADER ZONE */
.page-eyebrow{font-size:0.7rem;font-weight:600;text-transform:uppercase;letter-spacing:0.15em;color:var(--cyan);background:var(--cdim);border:1px solid rgba(0,212,255,0.2);border-radius:999px;padding:0.25rem 0.85rem;display:inline-flex;margin-bottom:1rem;}
.page-title{font-family:var(--fd);font-size:clamp(1.8rem,3.5vw,2.6rem);font-weight:800;color:var(--ow9);letter-spacing:-0.03em;line-height:1.1;margin-bottom:0.6rem;}
.page-title em{color:var(--cyan);font-style:normal;background:linear-gradient(135deg,var(--cyan),#5b9dff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.page-sub{font-size:0.93rem;color:var(--ow5);line-height:1.75;margin-bottom:2rem;max-width:580px;}

/* SCORE HERO */
.score-hero{background:var(--n8);border-radius:var(--rxl);padding:2.5rem;display:flex;gap:2rem;align-items:center;margin-bottom:1.25rem;position:relative;overflow:hidden;}
.score-hero::before{content:'';position:absolute;top:-80px;right:-60px;width:280px;height:280px;background:radial-gradient(circle,rgba(0,212,255,0.1),transparent 65%);}
.score-hero::after{content:'';position:absolute;bottom:-60px;left:-40px;width:200px;height:200px;background:radial-gradient(circle,rgba(245,158,11,0.08),transparent 65%);}
.score-num{font-family:var(--fd);font-size:5.5rem;font-weight:900;color:#fff;letter-spacing:-0.06em;line-height:1;white-space:nowrap;position:relative;z-index:1;}
.score-num sub{font-size:2rem;opacity:0.35;font-family:var(--fb);font-weight:400;vertical-align:baseline;}
.score-meta{flex:1;position:relative;z-index:1;}
.tier-badge{display:inline-block;font-size:0.72rem;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;padding:0.3rem 1rem;border-radius:999px;margin-bottom:0.75rem;}
.score-desc{font-size:0.9rem;color:rgba(255,255,255,0.65);line-height:1.75;font-weight:300;}

/* SECTION LABEL */
.sec-label{font-size:0.68rem;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:var(--ow3);margin-bottom:1.25rem;display:flex;align-items:center;gap:10px;}
.sec-label::after{content:'';flex:1;height:1px;background:var(--bw);}

/* PILLARS GRID */
.pillars-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:0.75rem;margin-bottom:1.25rem;}
.pillar-card{background:var(--card);border:1px solid var(--bw);border-radius:var(--r);padding:1.2rem 0.9rem;text-align:center;position:relative;overflow:hidden;transition:transform 0.2s var(--ease),box-shadow 0.2s;}
.pillar-card:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(8,14,30,0.1);}
.pillar-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;}
.pillar-name{font-size:0.68rem;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:var(--ow3);margin-bottom:0.6rem;}
.pillar-score{font-family:var(--fd);font-size:1.9rem;font-weight:900;letter-spacing:-0.04em;line-height:1;margin-bottom:0.5rem;}
.pillar-bar-bg{height:4px;background:var(--off);border-radius:2px;overflow:hidden;}
.pillar-bar-fill{height:100%;border-radius:2px;transition:width 1s var(--ease);}
.pillar-label{font-size:0.68rem;color:var(--ow3);margin-top:0.5rem;}

/* RADAR */
.radar-card{background:var(--card);border:1px solid var(--bw);border-radius:var(--r);padding:2rem 1.5rem 1.5rem;margin-bottom:1.25rem;}
.radar-wrap{max-width:480px;margin:0 auto;}

/* DIMENSION TABLE */
.dim-table{background:var(--card);border:1px solid var(--bw);border-radius:var(--r);overflow:hidden;margin-bottom:1.25rem;}
.dim-hdr{display:grid;grid-template-columns:1fr 60px 100px;padding:0.75rem 1.25rem;background:var(--off);border-bottom:1px solid var(--bw);font-size:0.68rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--ow3);}
.dim-row{display:grid;grid-template-columns:1fr 60px 100px;padding:0.875rem 1.25rem;border-bottom:1px solid var(--bw);align-items:center;transition:background 0.15s;}
.dim-row:last-child{border-bottom:none;}
.dim-row:hover{background:var(--off);}
.dim-name{font-size:0.85rem;color:var(--ow7);font-weight:500;}
.dim-pillar{font-size:0.7rem;color:var(--ow3);margin-top:2px;letter-spacing:0.04em;}
.dim-score-val{font-size:0.95rem;font-weight:700;color:var(--ow9);text-align:center;}
.dim-status{font-size:0.72rem;font-weight:600;padding:0.2rem 0.6rem;border-radius:999px;text-align:center;display:inline-flex;align-items:center;justify-content:center;}
.st-strong{background:#ecfdf5;color:#059669;}
.st-mid{background:#fffbeb;color:#92400e;}
.st-low{background:#fef2f2;color:#dc2626;}

/* INSIGHTS */
.insights-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1.25rem;}
.insight-card{background:var(--card);border:1.5px solid var(--bw);border-radius:var(--r);padding:1.4rem;position:relative;overflow:hidden;}
.insight-card.strength::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:#10b981;}
.insight-card.gap::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--rose);}
.ins-type{font-size:0.68rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;margin-bottom:0.4rem;}
.strength .ins-type{color:#059669;}
.gap .ins-type{color:#dc2626;}
.ins-dim{font-size:0.95rem;font-weight:700;color:var(--ow9);margin-bottom:0.5rem;font-family:var(--fd);}
.ins-text{font-size:0.83rem;color:var(--ow5);line-height:1.65;}

/* PRIORITY ACTIONS */
.priority-list{display:flex;flex-direction:column;gap:0.75rem;margin-bottom:1.25rem;}
.priority-item{background:var(--card);border:1px solid var(--bw);border-radius:var(--r);padding:1.2rem 1.25rem;display:flex;gap:1rem;align-items:flex-start;}
.priority-num{width:28px;height:28px;border-radius:50%;background:var(--n8);color:var(--cyan);font-size:0.78rem;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:var(--fd);}
.priority-content{}
.priority-title{font-size:0.9rem;font-weight:700;color:var(--ow9);margin-bottom:0.3rem;font-family:var(--fd);}
.priority-text{font-size:0.82rem;color:var(--ow5);line-height:1.6;}

/* HIRE CTA */
.hire-cta{background:var(--n8);border-radius:var(--rxl);padding:3rem 2.5rem;text-align:center;position:relative;overflow:hidden;margin-top:2.5rem;}
.hire-cta::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 70% 80% at 50% 0%,rgba(0,212,255,0.07),transparent);pointer-events:none;}
.hire-cta::after{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--cyan),#5b9dff,var(--cyan));background-size:200% auto;animation:sh 3s linear infinite;}
@keyframes sh{to{background-position:200% center;}}
.hire-eyebrow{display:inline-flex;font-size:0.68rem;font-weight:600;text-transform:uppercase;letter-spacing:0.14em;color:var(--cyan);background:var(--cdim);border:1px solid rgba(0,212,255,0.2);border-radius:999px;padding:0.25rem 0.85rem;margin-bottom:1rem;}
.hire-cta h2{font-family:var(--fd);font-size:clamp(1.5rem,3vw,2.1rem);font-weight:800;color:var(--t1);letter-spacing:-0.03em;margin-bottom:0.75rem;position:relative;z-index:1;}
.hire-cta p{font-size:0.93rem;color:var(--t5);max-width:500px;margin:0 auto 2rem;line-height:1.75;position:relative;z-index:1;}
.hire-actions{display:flex;gap:0.9rem;justify-content:center;flex-wrap:wrap;position:relative;z-index:1;}
.btn-cy{display:inline-flex;align-items:center;gap:6px;background:var(--cyan);color:var(--n9);font-family:var(--fb);font-size:0.88rem;font-weight:700;padding:0.72rem 1.6rem;border-radius:999px;text-decoration:none;border:none;cursor:pointer;box-shadow:0 4px 16px var(--cglow);transition:transform 0.15s,box-shadow 0.2s;}
.btn-cy:hover{transform:translateY(-2px);box-shadow:0 8px 28px var(--cglow);}
.btn-ol{display:inline-flex;align-items:center;gap:6px;background:transparent;color:var(--t1);font-family:var(--fb);font-size:0.88rem;font-weight:500;padding:0.72rem 1.5rem;border-radius:999px;border:1px solid var(--bn);text-decoration:none;cursor:pointer;transition:all 0.15s;}
.btn-ol:hover{border-color:rgba(0,212,255,0.35);background:var(--cdim);}

/* LOADING */
.loading-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:78vh;gap:0;text-align:center;}
.spin{width:52px;height:52px;border:3px solid var(--bw);border-top-color:var(--cyan);border-radius:50%;animation:spin 0.9s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.loading-title{font-family:var(--fd);font-size:1.5rem;font-weight:800;color:var(--ow9);}
.loading-sub{font-size:0.88rem;color:var(--ow5);max-width:300px;line-height:1.65;}

/* ── PREMIUM PROCESSING LOADER ── */
.proc{display:flex;flex-direction:column;align-items:center;gap:1.6rem;width:100%;max-width:440px;animation:fu 0.5s var(--ease) both;}
.proc-orb{position:relative;width:120px;height:120px;display:flex;align-items:center;justify-content:center;}
.proc-orb svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);}
.proc-orb .ring-bg{fill:none;stroke:rgba(0,212,255,0.1);stroke-width:6;}
.proc-orb .ring-fg{fill:none;stroke:url(#procGrad);stroke-width:6;stroke-linecap:round;stroke-dasharray:339.292;stroke-dashoffset:339.292;transition:stroke-dashoffset 0.6s var(--ease);}
.proc-orb .pct{font-family:var(--fd);font-size:1.7rem;font-weight:900;color:var(--ow9);letter-spacing:-0.03em;}
/* pulsing data bars inside the orb area as a backdrop motif */
.proc-pulse{position:absolute;display:flex;align-items:flex-end;gap:3px;height:36px;opacity:0.18;}
.proc-pulse i{width:4px;background:var(--cyan);border-radius:2px;animation:procBar 1.1s ease-in-out infinite;}
.proc-pulse i:nth-child(1){animation-delay:0s;}
.proc-pulse i:nth-child(2){animation-delay:0.12s;}
.proc-pulse i:nth-child(3){animation-delay:0.24s;}
.proc-pulse i:nth-child(4){animation-delay:0.36s;}
.proc-pulse i:nth-child(5){animation-delay:0.48s;}
@keyframes procBar{0%,100%{height:30%;}50%{height:100%;}}
.proc-head{font-family:var(--fd);font-size:1.4rem;font-weight:800;color:var(--ow9);letter-spacing:-0.02em;}
.proc-steps{display:flex;flex-direction:column;gap:0.55rem;width:100%;text-align:left;}
.proc-step{display:flex;align-items:center;gap:0.75rem;font-size:0.88rem;color:var(--ow3);padding:0.55rem 0.9rem;border-radius:var(--rsm);background:var(--card);border:1px solid var(--bw);transition:color 0.3s,border-color 0.3s,background 0.3s,transform 0.3s;opacity:0.5;transform:translateY(4px);}
.proc-step.active{opacity:1;transform:translateY(0);color:var(--ow9);border-color:rgba(0,212,255,0.4);background:rgba(0,212,255,0.04);}
.proc-step.done{opacity:1;transform:translateY(0);color:var(--ow7);}
.proc-tick{width:20px;height:20px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:0.65rem;font-weight:800;background:var(--off);color:var(--ow3);border:1.5px solid var(--bw);transition:all 0.3s;}
.proc-step.active .proc-tick{background:var(--cyan);border-color:var(--cyan);color:var(--n9);box-shadow:0 0 0 4px var(--cdim);}
.proc-step.active .proc-tick::after{content:'';width:7px;height:7px;border-radius:50%;background:var(--n9);animation:pulse 1s infinite;}
.proc-step.done .proc-tick{background:#ecfdf5;border-color:#10b981;color:#059669;}
.proc-step.done .proc-tick::after{content:'✓';}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:0.4;transform:scale(0.7);}}

/* INDUSTRY BENCHMARK */
.bench-card{background:var(--card);border:1px solid var(--bw);border-radius:var(--r);padding:1.6rem 1.5rem;margin-bottom:1.25rem;}
.bench-head{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:0.6rem;margin-bottom:1.3rem;}
.bench-title{font-family:var(--fd);font-size:1.05rem;font-weight:800;color:var(--ow9);letter-spacing:-0.02em;}
.bench-sub{font-size:0.78rem;color:var(--ow5);line-height:1.55;margin-top:0.2rem;}
.bench-pill{font-size:0.66rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--cyan);background:var(--cdim);border:1px solid rgba(0,212,255,0.2);border-radius:999px;padding:0.2rem 0.7rem;align-self:flex-start;}
.bench-row{display:grid;grid-template-columns:120px 1fr 80px;gap:0.85rem;align-items:center;padding:0.5rem 0;border-bottom:1px dashed var(--bw);}
.bench-row:last-child{border-bottom:none;}
.bench-name{font-size:0.82rem;color:var(--ow7);font-weight:600;}
.bench-tracks{position:relative;height:18px;}
.bench-track{position:absolute;inset:0;background:var(--off);border-radius:9px;overflow:hidden;}
.bench-fill-bench{position:absolute;top:50%;transform:translateY(-50%);height:2px;background:rgba(122,144,184,0.65);border-radius:1px;}
.bench-fill-you{position:absolute;top:3px;bottom:3px;border-radius:6px;}
.bench-pin-bench{position:absolute;top:50%;transform:translate(-50%,-50%);width:10px;height:10px;border-radius:50%;border:2px solid #7a90b8;background:#fff;}
.bench-delta{font-size:0.78rem;font-weight:700;text-align:right;font-family:var(--fd);}
.bench-delta.up{color:#059669;}
.bench-delta.down{color:#dc2626;}
.bench-delta.flat{color:var(--ow3);}
.bench-legend{display:flex;gap:1.2rem;font-size:0.72rem;color:var(--ow5);margin-top:1rem;flex-wrap:wrap;}
.bench-legend span{display:inline-flex;align-items:center;gap:0.45rem;}
.bench-legend .sw{width:22px;height:5px;border-radius:3px;background:var(--cyan);}
.bench-legend .sw-b{width:10px;height:10px;border-radius:50%;border:2px solid #7a90b8;background:#fff;}

/* COST OF INACTION */
.cost-card{background:linear-gradient(135deg,#fff8f1,#fff);border:1px solid #fed7aa;border-radius:var(--r);padding:1.8rem 1.6rem;margin-bottom:1.25rem;position:relative;overflow:hidden;}
.cost-card::before{content:'';position:absolute;top:-40px;right:-40px;width:200px;height:200px;background:radial-gradient(circle,rgba(245,158,11,0.13),transparent 65%);}
.cost-eyebrow{font-size:0.68rem;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:#b45309;margin-bottom:0.6rem;position:relative;z-index:1;}
.cost-title{font-family:var(--fd);font-size:1.15rem;font-weight:800;color:var(--ow9);letter-spacing:-0.02em;margin-bottom:0.9rem;position:relative;z-index:1;}
.cost-figure{font-family:var(--fd);font-size:2.4rem;font-weight:900;color:#b45309;letter-spacing:-0.04em;line-height:1;margin-bottom:0.5rem;position:relative;z-index:1;}
.cost-figure sub{font-size:0.85rem;color:#b45309;opacity:0.6;font-family:var(--fb);font-weight:500;vertical-align:baseline;}
.cost-body{font-size:0.87rem;color:var(--ow7);line-height:1.7;position:relative;z-index:1;margin-bottom:1rem;}
.cost-breakdown{display:flex;flex-wrap:wrap;gap:0.5rem;position:relative;z-index:1;}
.cost-tag{font-size:0.74rem;color:#92400e;background:rgba(245,158,11,0.1);border:1px solid rgba(245,158,11,0.25);border-radius:999px;padding:0.25rem 0.75rem;font-weight:500;}
.cost-note{font-size:0.7rem;color:var(--ow3);margin-top:0.9rem;line-height:1.5;font-style:italic;position:relative;z-index:1;}

/* DEEP DIVE */
.dim-row{cursor:pointer;}
.dim-row .dim-name{display:flex;align-items:center;gap:0.5rem;}
.dim-row .dim-chev{width:14px;height:14px;flex-shrink:0;color:var(--ow3);transition:transform 0.2s;display:inline-block;opacity:0.6;}
.dim-row .dim-chev svg{width:100%;height:100%;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.dim-row.open .dim-chev{transform:rotate(180deg);opacity:1;color:var(--cyan);}
.dim-deep{display:none;grid-column:1 / -1;padding:0.9rem 0 0.2rem;font-size:0.82rem;color:var(--ow5);line-height:1.7;border-top:1px dashed var(--bw);margin-top:0.6rem;}
.dim-deep b{color:var(--ow7);font-weight:600;}
.dim-row.open .dim-deep{display:block;}

.footer{font-size:0.75rem;color:var(--ow3);text-align:center;margin-top:2.5rem;padding-bottom:1.5rem;}
@media(max-width:700px){.pillars-grid{grid-template-columns:repeat(3,1fr);}.insights-grid{grid-template-columns:1fr;}.score-hero{flex-direction:column;align-items:flex-start;gap:1rem;}.score-num{font-size:4rem;}.dim-hdr,.dim-row{grid-template-columns:1fr 44px 80px;padding:0.75rem 1rem;}.main{padding:2rem 1rem 6rem;}.hire-cta{padding:2.5rem 1.5rem;}}
@media(max-width:500px){.pillars-grid{grid-template-columns:repeat(2,1fr);}}</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" integrity="sha512-CQBWl4fJHWbryGE+Pc7UAxWMUMNMWzWxF4SQo9CgkJIN1kx6djDQZjh3Y8SZ1d+6I+1zze6Z7kHXO7q3UyZAWw==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script>
const PILLAR_META={
  infrastructure:{label:'Data Infrastructure',short:'Infra',color:'#00d4ff',keys:['q1','q2','q3','q4']},
  reporting:{label:'Reporting & Dashboards',short:'Reporting',color:'#5b9dff',keys:['q5','q6','q7','q8']},
  automation:{label:'Automation & Workflows',short:'Automation',color:'#10d9a0',keys:['q9','q10','q11']},
  ai:{label:'AI Readiness',short:'AI',color:'#f59e0b',keys:['q12','q13','q14']},
  decisions:{label:'Decision Culture',short:'Decisions',color:'#fb7185',keys:['q15','q16','q17','q18','q19']},
};
const Q_META={
  q1:{label:'Data Storage',pillar:'infrastructure'},q2:{label:'Data Quality',pillar:'infrastructure'},
  q3:{label:'Data Access',pillar:'infrastructure'},q4:{label:'System Integration',pillar:'infrastructure'},
  q5:{label:'Report Freshness',pillar:'reporting'},q6:{label:'Report Usefulness',pillar:'reporting'},
  q7:{label:'Manual Effort',pillar:'reporting'},q8:{label:'KPI Visibility',pillar:'reporting'},
  q9:{label:'Repetitive Tasks',pillar:'automation'},q10:{label:'Tool Connections',pillar:'automation'},
  q11:{label:'Error Reduction',pillar:'automation'},
  q12:{label:'AI Adoption',pillar:'ai'},q13:{label:'Data Readiness for AI',pillar:'ai'},q14:{label:'AI ROI Awareness',pillar:'ai'},
  q15:{label:'Decision Quality',pillar:'decisions'},q16:{label:'Data Confidence',pillar:'decisions'},
  q17:{label:'Speed of Insight',pillar:'decisions'},q18:{label:'Data Culture',pillar:'decisions'},q19:{label:'Future Readiness',pillar:'decisions'},
};
const TIER={
  advanced:{min:8.5,label:'Advanced',bg:'rgba(16,217,160,0.15)',color:'#10d9a0',desc:"Your organisation operates at an advanced level of data maturity. You have the infrastructure, automation, and culture to make decisions confidently from live data. The opportunity now is to leverage AI more strategically and compound your advantages."},
  proficient:{min:6.5,label:'Proficient',bg:'rgba(0,212,255,0.15)',color:'#00d4ff',desc:"Your data setup is working but there are meaningful gaps holding you back from full potential. Systems exist but may be fragile or manual in places. With targeted improvements — especially in automation and reporting — you'll unlock significantly more value."},
  developing:{min:4.5,label:'Developing',bg:'rgba(245,158,11,0.15)',color:'#f59e0b',desc:"Your organisation has started its data journey but is still relying heavily on manual processes, disconnected tools, and ad hoc reporting. There is significant untapped value in fixing your foundations — infrastructure and automation improvements will have the highest ROI."},
  reactive:{min:0,label:'Reactive',bg:'rgba(251,113,133,0.15)',color:'#fb7185',desc:"Your data setup is largely reactive — decisions are made without reliable, timely data and most reporting is manual. The good news: this also means there's enormous room for quick wins. Even basic automation and a simple dashboard would transform your team's daily experience."},
};
const INSIGHTS={
  infrastructure:{s:"Your data infrastructure is a genuine asset — data is reliable, centralised, and accessible. This foundation supports everything else you want to build.",g:"Your data infrastructure has gaps that are limiting everything downstream. Disconnected systems and untrustworthy data are the root cause of most manual work and poor decisions."},
  reporting:{s:"Your reporting setup is working well — dashboards are automated, useful, and trusted. This is rare and gives your team a real advantage in speed of decision making.",g:"Reporting is consuming too much time and delivering too little clarity. Automating your core dashboards would be one of the highest-ROI changes you could make right now."},
  automation:{s:"Automation is embedded in how your organisation operates. Manual errors are rare and your tools work together — this is a significant competitive advantage.",g:"Manual processes are slowing your team down and creating data errors. Automation is the single biggest lever available to you — the hours saved compound every week."},
  ai:{s:"Your organisation is already leveraging AI effectively and your data is in good enough shape to power intelligent workflows. You're ahead of most businesses at your stage.",g:"AI readiness is low — but that's often a data infrastructure problem more than an AI problem. Getting your data foundations right is the prerequisite to meaningful AI adoption."},
  decisions:{s:"Data-driven decision making is embedded in your culture. Your team trusts the numbers and can get answers quickly — this gives you a clear speed advantage over less informed competitors.",g:"Decisions are too often based on assumptions rather than data. This limits your ability to move quickly, identify opportunities, and manage risk. Better dashboards and clearer KPIs are the starting point."},
};
const INDUSTRY_BENCH={
  'Consulting / Professional Services':{infrastructure:5.5,reporting:5.8,automation:4.5,ai:4.2,decisions:6.2},
  'E-commerce / Retail':            {infrastructure:6.2,reporting:6.5,automation:6.0,ai:5.0,decisions:5.8},
  'Finance / Accounting':           {infrastructure:6.8,reporting:7.0,automation:5.5,ai:4.0,decisions:6.5},
  'Healthcare':                     {infrastructure:5.0,reporting:5.2,automation:4.0,ai:3.5,decisions:5.5},
  'Manufacturing / Operations':     {infrastructure:5.8,reporting:6.0,automation:5.5,ai:3.8,decisions:5.5},
  'Marketing / Agency':             {infrastructure:5.0,reporting:5.5,automation:5.2,ai:5.5,decisions:5.5},
  'Real Estate':                    {infrastructure:4.5,reporting:4.8,automation:3.8,ai:3.5,decisions:5.0},
  'Technology / SaaS':              {infrastructure:7.0,reporting:7.0,automation:6.8,ai:6.0,decisions:6.5},
  'Education':                      {infrastructure:4.5,reporting:4.8,automation:3.8,ai:3.8,decisions:5.2},
  'Other':                          {infrastructure:5.5,reporting:5.7,automation:5.0,ai:4.5,decisions:5.7},
};
const SIZE_HEADCOUNT={
  'Just me / Solo':1,'2–10 people':6,'11–50 people':25,'51–200 people':100,'200+ people':350,
};
const Q_DEEP={
  q1:"<b>What this measures:</b> Whether your business operates from one source of truth or many. <b>Why your score matters:</b> Below 5 means most of your data lives in someone's personal spreadsheet — you can't automate what you can't centralise. <b>What 'fixed' looks like:</b> A single warehouse or governed lakehouse (Fabric, Snowflake, Postgres) where every system writes and every report reads from.",
  q2:"<b>What this measures:</b> Confidence that the numbers you see are correct. <b>Why your score matters:</b> Data-quality debt compounds — every dashboard built on bad data inherits the error. <b>What 'fixed' looks like:</b> Automated validation rules, dedupe routines, and a small set of golden datasets the rest of the org reads from.",
  q3:"<b>What this measures:</b> How easily non-technical staff can self-serve. <b>Why your score matters:</b> If one person owns access, everyone else's questions queue behind them — that's a productivity tax. <b>What 'fixed' looks like:</b> Role-based dashboards and clear data ownership, so each team has the slice it needs without IT in the loop.",
  q4:"<b>What this measures:</b> Whether your tools talk to each other. <b>Why your score matters:</b> Manual copy between systems is where most data errors and hours-wasted hide. <b>What 'fixed' looks like:</b> Zapier/Make/Power Automate or direct API integrations carrying data between CRM, finance, ops with zero human steps.",
  q5:"<b>What this measures:</b> Whether reports refresh automatically vs. someone rebuilding them. <b>Why your score matters:</b> Manual refresh is the most common reason teams say 'we have reporting' but still feel blind. <b>What 'fixed' looks like:</b> Live or scheduled refreshes; reports are always up-to-date by the time anyone opens them.",
  q6:"<b>What this measures:</b> Whether dashboards drive action or just display metrics. <b>Why your score matters:</b> A pretty dashboard that nobody acts on is theatre. <b>What 'fixed' looks like:</b> Every chart maps to a decision someone is supposed to make — and ideally, includes a benchmark or threshold for what 'good' looks like.",
  q7:"<b>What this measures:</b> Manual data-prep load across your team. <b>Why your score matters:</b> Hours spent copying and reformatting are hours not spent on actual work. <b>What 'fixed' looks like:</b> Under 2 team-hours per week, total. Reports build themselves; people focus on interpreting them.",
  q8:"<b>What this measures:</b> Whether leadership has live access to the numbers that matter. <b>Why your score matters:</b> If leaders rely on requested reports, they're always running on stale data. <b>What 'fixed' looks like:</b> A live executive dashboard with the 5–10 KPIs that drive the business, refreshed automatically.",
  q9:"<b>What this measures:</b> How much of your operational work is on autopilot. <b>Why your score matters:</b> Repetitive tasks are the lowest-hanging fruit in any automation engagement. <b>What 'fixed' looks like:</b> Notifications, data transfers, report sending, file routing — all scheduled or triggered automatically.",
  q10:"<b>What this measures:</b> Whether information flows between systems without humans. <b>Why your score matters:</b> Disconnected tools force your team to be the integration layer, which is slow and error-prone. <b>What 'fixed' looks like:</b> Form submissions land in your CRM and warehouse automatically; sales data appears in finance without anyone re-entering it.",
  q11:"<b>What this measures:</b> Frequency of data-quality issues caused by manual handling. <b>Why your score matters:</b> Silent copy-paste errors don't get caught until they cause an expensive bad decision. <b>What 'fixed' looks like:</b> The human is no longer in the data-handling loop — automation removes the failure mode entirely.",
  q12:"<b>What this measures:</b> How embedded AI is in your operational workflows. <b>Why your score matters:</b> Using AI to draft emails is table stakes; using it to classify, summarise, and decide is leverage. <b>What 'fixed' looks like:</b> AI is wired into your data pipelines — auto-tagging, summarising customer feedback, generating reports from raw inputs.",
  q13:"<b>What this measures:</b> Whether your data is in a state where AI can use it. <b>Why your score matters:</b> 'We tried AI and it didn't work' usually means 'our data wasn't ready, but we blamed the model.' <b>What 'fixed' looks like:</b> Clean, structured, accessible core datasets with consistent identifiers — any LLM pipeline can plug in.",
  q14:"<b>What this measures:</b> Whether you've identified specific AI ROI opportunities. <b>Why your score matters:</b> Without specific use cases, AI investment becomes a science fair. <b>What 'fixed' looks like:</b> A shortlist of 2–5 workflows where AI would save real hours, with rough estimates of value.",
  q15:"<b>What this measures:</b> Whether decisions are made with data on the table. <b>Why your score matters:</b> Gut-feel decisions aren't wrong, but they're unverifiable — you can't learn from them at scale. <b>What 'fixed' looks like:</b> Every major decision references the relevant dashboard or analysis; outcomes are reviewed against the data later.",
  q16:"<b>What this measures:</b> Whether the team trusts the numbers in front of them. <b>Why your score matters:</b> If meetings debate the data itself, you're auditing instead of deciding. <b>What 'fixed' looks like:</b> One source of truth, agreed metric definitions, and meetings that start from the dashboard — not arguments about whose numbers are right.",
  q17:"<b>What this measures:</b> Speed from question to reliable answer. <b>Why your score matters:</b> Companies that answer in hours run circles around companies that answer in weeks. <b>What 'fixed' looks like:</b> Most business questions can be answered the same day from existing dashboards; the rest take a brief ad-hoc query.",
  q18:"<b>What this measures:</b> Whether data literacy lives across the team or in one person. <b>Why your score matters:</b> Single-point-of-failure analysts become bottlenecks and burnout cases. <b>What 'fixed' looks like:</b> Most team members can read and act on their dashboard without help; basic SQL/Excel literacy is widespread.",
  q19:"<b>What this measures:</b> Whether you have a real 12-month plan for data improvement. <b>Why your score matters:</b> Businesses without concrete plans stay in the same data state year after year. <b>What 'fixed' looks like:</b> A documented roadmap with owners, milestones, and budget — even a one-page version beats a wish list.",
};
const PRIORITY_COPY={
  infrastructure:["Fix your data foundation first","Your scores suggest data is scattered across tools and spreadsheets. The first step is consolidating into a single source of truth — whether that's a simple integrated Google Sheet system, a Notion database, or a proper data warehouse. Until this is fixed, everything downstream is unreliable."],
  reporting:["Automate your most painful reports","Identify the report that takes the most time to produce every week or month. That's the one to automate first. A well-built automated report pays for itself within weeks — and frees your team to do actual work instead of data formatting."],
  automation:["Connect your key tools","Map the top 3 manual data transfers your team does regularly. Each one is an automation opportunity. Zapier, Power Automate, or a simple Google Apps Script can often eliminate hours of weekly copy-paste work with a one-time setup."],
  ai:["Prepare your data for AI before adding AI","The biggest barrier to useful AI isn't the AI — it's dirty, unstructured data. Clean up your core datasets first. Once your data is reliable and structured, connecting an LLM pipeline becomes straightforward and highly effective."],
  decisions:["Build one dashboard that answers your top 5 business questions","Most organisations don't need 20 dashboards. They need one great one. Define the 5 questions your leadership needs answered every week and build a single live view that answers them automatically."],
};

function getTier(score){
  if(score>=8.5)return TIER.advanced;
  if(score>=6.5)return TIER.proficient;
  if(score>=4.5)return TIER.developing;
  return TIER.reactive;
}
function getStatus(score){
  if(score>=7)return{cls:'st-strong',label:'Strong'};
  if(score>=5)return{cls:'st-mid',label:'Developing'};
  return{cls:'st-low',label:'Focus Area'};
}

function buildReport(){
  const raw=sessionStorage.getItem('dv_assessment');
  if(!raw){
    document.getElementById('loadingState')&&(document.getElementById('loadingState').style.display='none');
    document.getElementById('main').innerHTML=`<div style="text-align:center;padding:4rem 1rem"><div style="font-family:'Cabinet Grotesk',sans-serif;font-size:1.8rem;font-weight:800;margin-bottom:1rem;color:var(--ow9)">No results found</div><p style="color:var(--ow5);margin-bottom:2rem">Please complete the assessment first.</p><a href="dv-assessment.html" style="background:var(--cyan);color:var(--n9);padding:0.7rem 1.5rem;border-radius:999px;text-decoration:none;font-weight:700;font-size:0.88rem">Take the assessment →</a></div>`;
    return;
  }
  const {scores,ctx,pillars,overall}=JSON.parse(raw);
  const tier=getTier(overall);
  const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const firstName=esc(ctx.fname)||'there';
  const safeIndustry=esc(ctx.industry);

  // Sort pillars for strengths and gaps
  const pillarArr=Object.entries(pillars).map(([k,v])=>({key:k,score:v,...PILLAR_META[k]}));
  const sorted=[...pillarArr].sort((a,b)=>b.score-a.score);
  const topStrengths=sorted.slice(0,2);
  const topGaps=sorted.slice(-2).reverse();
  const topPriority=sorted[sorted.length-1];

  // Build Q rows with deep-dive
  const qRows=Object.entries(Q_META).map(([k,m])=>{
    const sc=scores[k]||5;
    const st=getStatus(sc);
    const pm=PILLAR_META[m.pillar];
    const deep=Q_DEEP[k]||'';
    return `<div class="dim-row" data-qid="${k}">
      <div><div class="dim-name"><span class="dim-chev"><svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg></span>${m.label}</div><div class="dim-pillar">${pm.label}</div></div>
      <div class="dim-score-val">${sc}<span style="font-size:0.7rem;color:var(--ow3)">/10</span></div>
      <div style="text-align:right"><span class="dim-status ${st.cls}">${st.label}</span></div>
      ${deep?`<div class="dim-deep">${deep}</div>`:''}
    </div>`;
  }).join('');

  // Build industry benchmark rows (only if industry was selected and we have data for it)
  const bench=INDUSTRY_BENCH[ctx.industry]||null;
  const benchHTML=bench?pillarArr.map(p=>{
    const you=p.score, target=bench[p.key]||5;
    const youPct=((you-1)/9*100).toFixed(1);
    const targetPct=((target-1)/9*100).toFixed(1);
    const diff=+(you-target).toFixed(1);
    const cls=diff>0.3?'up':diff<-0.3?'down':'flat';
    const sign=diff>0?'+':'';
    return `<div class="bench-row">
      <div class="bench-name">${p.short}</div>
      <div class="bench-tracks">
        <div class="bench-track"></div>
        <div class="bench-fill-you" style="left:0;width:${youPct}%;background:${p.color};opacity:0.85"></div>
        <div class="bench-pin-bench" style="left:${targetPct}%"></div>
      </div>
      <div class="bench-delta ${cls}">${diff===0?'on par':sign+diff}</div>
    </div>`;
  }).join(''):'';

  // Cost-of-inaction calc — based on weakest reporting + automation gap × team size
  const headcount=SIZE_HEADCOUNT[ctx.size]||10;
  const autoGap=Math.max(0,7-pillars.automation); // 7 = healthy target
  const repGap=Math.max(0,7-pillars.reporting);
  const infraGap=Math.max(0,7-pillars.infrastructure);
  // Each gap point ≈ 0.5 hrs/week/person of manual work; weighted toward reporting/automation
  const weeklyHrs=Math.round(headcount*(autoGap*0.6+repGap*0.5+infraGap*0.3)*0.5);
  const annualHrs=weeklyHrs*48;
  const annualCost=Math.round(annualHrs*45); // $45/hr blended rate
  const fmt$=n=>'$'+n.toLocaleString();
  const showCost=weeklyHrs>0;

  // Priority actions — bottom 3 pillars
  const bottom3=sorted.slice(-3).reverse();
  const priorityHTML=bottom3.map((p,i)=>{
    const copy=PRIORITY_COPY[p.key];

function runLoader(){
  // If there are no stored results, skip straight to buildReport (it shows the empty state).
  if(!sessionStorage.getItem('dv_assessment')){buildReport();return;}
  const ring=document.getElementById('procRing');
  const pctEl=document.getElementById('procPct');
  const steps=[...document.querySelectorAll('.proc-step')];
  const C=2*Math.PI*54; // circumference
  if(ring)ring.style.strokeDasharray=C;
  let prog=0;
  const targets=[18,42,62,82,100];   // progress checkpoint after each step
  const holds=[850,1050,950,1000,800]; // ms each step is "active" (slowed so users can follow)
  let i=0;
  function setProg(p){prog=p;if(ring)ring.style.strokeDashoffset=C*(1-p/100);if(pctEl)pctEl.textContent=Math.round(p)+'%';}
  function tick(){
    if(i>=steps.length){
      // brief beat at 100%, then reveal
      setTimeout(()=>{buildReport();},650);
      return;
    }
    steps[i].classList.add('active');
    // animate progress smoothly toward this step's target
    const start=prog,end=targets[i],dur=holds[i],t0=performance.now();
    function anim(now){
      const k=Math.min(1,(now-t0)/dur);
      setProg(start+(end-start)*(k<0.5?2*k*k:1-Math.pow(-2*k+2,2)/2));
      if(k<1){requestAnimationFrame(anim);}
      else{
        steps[i].classList.remove('active');
        steps[i].classList.add('done');
        i++;
        tick();
      }
    }
    requestAnimationFrame(anim);
  }
  setProg(0);
  setTimeout(tick,450);
}
runLoader();
